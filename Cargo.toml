[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/NotsleepSXS/stylized3dpaint"

[workspace.dependencies]
s3dp-core = { path = "crates/s3dp-core" }
s3dp-render = { path = "crates/s3dp-render" }
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
egui = "0.36"
egui-wgpu = "0.36"
glam = { version = "0.34", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
gltf = "1.4"
mikktspace = { package = "bevy_mikktspace", version = "1" }
tobj = "4"
ufbx = "0.11"
rfd = "0.17"
anyhow = "1"
half = { version = "2", features = ["bytemuck"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
egui-phosphor = "0.14"
egui_dock = "0.21"
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
env_logger = "0.11"
s3dp-export = { path = "crates/s3dp-export" }
s3dp-tablet = { path = "crates/s3dp-tablet" }
raw-window-handle = "0.6"
exr = { version = "1.73", default-features = false }

[profile.dev.package."*"]
opt-level = 2
